services:

  # Database MySQL
  db:
    image: mysql:8.0.33
    container_name: dompetku_db
    restart: always
    environment:
      MYSQL_DATABASE: dompetku
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_USER: ${DB_USER:-dompetku_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-dompetku_pass}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./src/database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Python
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: dompetku_backend
    restart: always
    env_file:
      - .env
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src/backend:/app

  # phpMyAdmin - untuk lihat isi database lewat browser
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: dompetku_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USER:-dompetku_user}
      PMA_PASSWORD: ${DB_PASSWORD:-dompetku_pass}
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  db_data:
