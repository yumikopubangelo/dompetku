{% extends "base.html" %}
{% block title %}Rekap Bulanan{% endblock %}

{% block content %}
<div class="content-card">
  <div class="card-header">
    <h2>Rekap Keuangan Bulanan</h2>
  </div>

  <div class="rekap-controls">
    <select id="bulan">
      <option value="1">Januari</option><option value="2">Februari</option><option value="3">Maret</option>
      <option value="4">April</option><option value="5">Mei</option><option value="6">Juni</option>
      <option value="7">Juli</option><option value="8">Agustus</option><option value="9">September</option>
      <option value="10">Oktober</option><option value="11">November</option><option value="12">Desember</option>
    </select>
    <input type="number" id="tahun" value="2024" min="2020" max="2030">
    <button class="btn btn-primary" onclick="loadRekap()">Lihat Rekap</button>
  </div>

  <div class="rekap-summary" id="rekapSummary" style="display:none;">
    <div class="rekap-item pemasukan"><h4>Total Pemasukan</h4><p id="rekapPemasukan">Rp 0</p></div>
    <div class="rekap-item pengeluaran"><h4>Total Pengeluaran</h4><p id="rekapPengeluaran">Rp 0</p></div>
    <div class="rekap-item saldo"><h4>Selisih</h4><p id="rekapSelisih">Rp 0</p></div>
  </div>

  <div class="table-container">
    <table id="rekapTable">
      <thead>
        <tr><th>Tipe</th><th>Kategori</th><th>Total</th></tr>
      </thead>
      <tbody id="rekapList"><tr><td colspan="3" style="text-align:center;">Pilih bulan dan tahun</td></tr></tbody>
    </table>
  </div>
</div>

<script>
async function loadRekap() {
  const bulan = document.getElementById('bulan').value;
  const tahun = document.getElementById('tahun').value;

  try {
    const response = await apiFetch(`/rekap/bulanan?bulan=${bulan}&tahun=${tahun}`);
    if (!response.ok) throw new Error('Gagal memuat rekap');
    const data = await response.json();

    document.getElementById('rekapSummary').style.display = 'grid';
    document.getElementById('rekapPemasukan').innerText = formatRupiah(data.total_pemasukan);
    document.getElementById('rekapPengeluaran').innerText = formatRupiah(data.total_pengeluaran);
    document.getElementById('rekapSelisih').innerText = formatRupiah(data.saldo_akhir);

    const tbody = document.getElementById('rekapList');
    const pemasukanRows = (data.pemasukan_per_kategori || []).map((row) => `
      <tr>
        <td><span class="badge badge-success">pemasukan</span></td>
        <td>${row.kategori}</td>
        <td>${formatRupiah(row.total)}</td>
      </tr>
    `);
    const pengeluaranRows = (data.pengeluaran_per_kategori || []).map((row) => `
      <tr>
        <td><span class="badge badge-danger">pengeluaran</span></td>
        <td>${row.kategori}</td>
        <td>${formatRupiah(row.total)}</td>
      </tr>
    `);
    const rows = [...pemasukanRows, ...pengeluaranRows];

    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Tidak ada transaksi bulan ini</td></tr>';
      return;
    }

    tbody.innerHTML = rows.join('');
  } catch (e) {
    showAlert('Gagal memuat rekap', 'danger');
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const now = new Date();
  document.getElementById('bulan').value = now.getMonth() + 1;
  document.getElementById('tahun').value = now.getFullYear();
  loadRekap();
});
</script>
{% endblock %}
