{% extends "base.html" %}
{% block title %}Registrasi{% endblock %}

{% block content %}
<div class="content-card" style="max-width: 420px; margin: 4rem auto;">
  <div class="card-header" style="margin-bottom: 1rem;">
    <h2>Daftar Akun Dompetku</h2>
  </div>
  <form id="registerForm">
    <div class="form-group">
      <label class="form-label" for="username">Username</label>
      <input class="form-control" id="username" name="username" minlength="3" required />
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input class="form-control" id="password" name="password" type="password" minlength="6" required />
    </div>
    <div class="form-group">
      <label class="form-label" for="confirmPassword">Konfirmasi Password</label>
      <input class="form-control" id="confirmPassword" name="confirmPassword" type="password" minlength="6" required />
    </div>
    <button class="btn btn-primary" type="submit" style="width: 100%;">Daftar</button>
  </form>
  <p style="margin-top:1rem;text-align:center;">
    Sudah punya akun?
    <a href="/login">Masuk di sini</a>
  </p>
</div>

<script>
  document.getElementById("registerForm").addEventListener("submit", async (event) => {
    event.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
      showAlert("Konfirmasi password tidak cocok", "danger");
      return;
    }

    try {
      await registerWithCredentials(username, password, confirmPassword);
      showAlert("Registrasi berhasil", "success");
      window.location.href = "/dashboard";
    } catch (error) {
      showAlert(error.message || "Registrasi gagal", "danger");
    }
  });
</script>
{% endblock %}
